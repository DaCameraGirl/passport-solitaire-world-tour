<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .title{font:800 58px Segoe UI,Arial,sans-serif;letter-spacing:1px;fill:#f7f3ff}.sub{font:500 22px Segoe UI,Arial,sans-serif;fill:#a79fc7}.mono{font:800 15px Consolas,monospace;letter-spacing:4px;fill:#7de8d4}.route{stroke-dasharray:12 18;animation:dash 18s linear infinite}.plane{offset-rotate:auto;animation:fly 11s linear infinite}.plane.two{animation-delay:-3.5s}.plane.three{animation-delay:-7s}@keyframes dash{to{stroke-dashoffset:-420}}@keyframes fly{to{offset-distance:100%}}
  </style>
  <defs>
    <linearGradient id="bg" x1="0" x2="1200" y1="0" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#080716"/><stop offset=".55" stop-color="#171235"/><stop offset="1" stop-color="#04272b"/></linearGradient>
    <linearGradient id="glow" x1="200" x2="960" y1="50" y2="360" gradientUnits="userSpaceOnUse"><stop stop-color="#ff6ec7"/><stop offset=".45" stop-color="#7de8d4"/><stop offset="1" stop-color="#ffc857"/></linearGradient>
    <path id="route1" d="M90 305 C245 185 365 365 520 228 S835 70 1110 154"/>
    <path id="route2" d="M112 170 C315 92 410 120 560 208 S804 350 1075 286"/>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <circle cx="190" cy="85" r="140" fill="#ff6ec7" opacity=".18" filter="url(#blur)"/>
  <circle cx="1010" cy="300" r="150" fill="#7de8d4" opacity=".18" filter="url(#blur)"/>
  <path d="M120 330H1080" stroke="#ffffff" opacity=".06"/>
  <path d="M150 330C220 250 300 250 380 330C460 250 540 250 620 330C700 250 780 250 860 330C940 250 1020 250 1090 330" stroke="#fff" opacity=".08"/>
  <use href="#route1" class="route" stroke="url(#glow)" stroke-width="3" opacity=".7"/>
  <use href="#route2" class="route" stroke="#7b9dff" stroke-width="2" opacity=".42"/>
  <g class="plane" style="offset-path:path('M90 305 C245 185 365 365 520 228 S835 70 1110 154')"><path d="M0 0L46 14L0 28L9 16L-25 16L-25 12L9 12L0 0Z" fill="#f7f3ff"/><path d="M-25 12L-78 4" stroke="#7de8d4" stroke-width="5" stroke-linecap="round" opacity=".35"/></g>
  <g class="plane two" style="offset-path:path('M112 170 C315 92 410 120 560 208 S804 350 1075 286')"><path d="M0 0L38 12L0 24L7 14L-20 14L-20 10L7 10L0 0Z" fill="#ffc857"/><path d="M-20 12L-64 5" stroke="#ffc857" stroke-width="4" stroke-linecap="round" opacity=".3"/></g>
  <g class="plane three" style="offset-path:path('M90 305 C245 185 365 365 520 228 S835 70 1110 154')"><path d="M0 0L34 10L0 20L6 12L-18 12L-18 8L6 8L0 0Z" fill="#ff6ec7"/><path d="M-18 10L-58 2" stroke="#ff6ec7" stroke-width="4" stroke-linecap="round" opacity=".3"/></g>
  <text x="74" y="92" class="mono">PASSPORT SOLITAIRE</text>
  <text x="74" y="170" class="title">World Tour</text>
  <text x="76" y="214" class="sub">A browser solitaire journey with stamps, cities, and sky trails.</text>
  <g transform="translate(76 260)"><rect width="236" height="68" rx="16" fill="#ffffff" opacity=".08"/><circle cx="43" cy="34" r="22" stroke="#7de8d4" stroke-width="3"/><text x="30" y="40" font-family="Consolas,monospace" font-size="17" font-weight="800" fill="#7de8d4">PS</text><text x="78" y="30" font-family="Segoe UI,Arial" font-size="16" font-weight="800" fill="#f7f3ff">55 destinations</text><text x="78" y="50" font-family="Segoe UI,Arial" font-size="13" fill="#a79fc7">Win hands. Collect stamps.</text></g>
</svg>
